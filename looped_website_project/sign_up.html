<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up</title>
    <link rel="icon" type="image/x-icon" href="Images/looped_favicon.png">
    <link rel='stylesheet' type='text/css' media='screen' href='second.css'>
    <!-- Bootstrap import -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Header Section -->
    <header id="header">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="index.html">
                <img src="Images/looped_logo.png" alt="Looped Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav mx-auto">
                    <a class="nav-link" href="the_app.html">The App</a>
                    <a class="nav-link" href="our_promises.html">FAQ</a>
                    <a class="nav-link" href="what_to_expect.html">What to Expect</a>
                    <a class="nav-link" href="about_us.html">About Us</a>
                    <a class="nav-link active" href="sign_up.html">Sign Up</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Sign-Up Form Section -->
    <main class="container my-5">
        <section class="text-center">
            <h1 class="display-4 text-primary mb-4">Create Your Account</h1>
            <p class="lead text-muted mb-4">Join Looped today and take the next step towards simplifying your university experience.</p>
        </section>

        <!-- Sign-Up Form -->
        <section id="sign-up-form">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form>
                        <div class="mb-3">
                            <label for="Organization Name" class="form-label">Organization Name</label>
                            <input type="text" class="form-control" id="OrganizationName" placeholder="Enter your Organization name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email address">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Create a password">
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="termsAndConditions">
                            <label class="form-check-label" for="termsAndConditions">
                                I agree to the <a href="#">terms and conditions</a>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-primary text-white text-center py-4">
        <div class="footer-content">
          <img src="images/looped_favicon.png" alt="Looped Logo" class="footer-logo">
          <p>&copy; 2025 Looped. All rights reserved.</p>
        </div>
        <a href="#header" class="go-back">Go Up</a>
      </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>

</html>
